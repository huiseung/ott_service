name: ott_service

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ott_service
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

  mysql-init:
    image: mysql:8.0
    depends_on:
      - mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      until mysqladmin ping -hmysql -uroot -p$$MYSQL_ROOT_PASSWORD --silent; do sleep 1; done;
      mysql -hmysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'create database if not exists ott_service character set utf8mb4 collate utf8mb4_0900_ai_ci';
      exit 0;
      "

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/ott-originals;
      exit 0;
      "

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${WATCH_EVENTS_PARTITIONS:-12}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/bitnami/kafka

  admin-api:
    build:
      context: ./backend
      dockerfile: admin-api/Dockerfile
    depends_on:
      - mysql-init
      - minio-init
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ott_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      APP_SECURITY_ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      APP_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_SECURITY_ADMIN_WEB_ORIGIN: http://localhost:3001
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "8080:8080"

  user-api:
    build:
      context: ./backend
      dockerfile: user-api/Dockerfile
    depends_on:
      - mysql-init
      - minio-init
      - redis
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ott_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      APP_SECURITY_USER_WEB_ORIGIN: http://localhost:3000
      APP_USER_SECURITY_LOCAL_TEST_USER_ENABLED: ${LOCAL_TEST_USER_ENABLED:-false}
      APP_USER_SECURITY_LOCAL_TEST_USER_PASSWORD: ${LOCAL_TEST_USER_PASSWORD:-}
      APP_USER_SECURITY_ACCESS_TOKEN_SECRET: ${USER_ACCESS_TOKEN_SECRET:?Set USER_ACCESS_TOKEN_SECRET in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PLAYBACK_WATCH_EVENTS_TOPIC: ${WATCH_EVENTS_TOPIC:-watch-events}
      APP_PLAYBACK_WATCH_EVENTS_DLQ_TOPIC: ${WATCH_EVENTS_DLQ_TOPIC:-watch-events.dlq}
      APP_PLAYBACK_WATCH_EVENTS_PARTITIONS: ${WATCH_EVENTS_PARTITIONS:-12}
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

  playback-worker:
    build:
      context: ./backend
      dockerfile: playback-worker/Dockerfile
    depends_on:
      - mysql-init
      - redis
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ott_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PLAYBACK_WORKER_WATCH_EVENTS_TOPIC: ${WATCH_EVENTS_TOPIC:-watch-events}
      PLAYBACK_WORKER_WATCH_EVENTS_DLQ_TOPIC: ${WATCH_EVENTS_DLQ_TOPIC:-watch-events.dlq}
      PLAYBACK_WORKER_CONSUMER_GROUP_ID: ${PLAYBACK_CONSUMER_GROUP:-playback-progress-group}

  playback-lb:
    image: nginx:1.27-alpine
    depends_on:
      - user-api
    ports:
      - "8088:8088"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro

  media-worker:
    build:
      context: ./backend
      dockerfile: media-worker/Dockerfile
    depends_on:
      - mysql-init
      - minio-init
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ott_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MEDIA_WORKER_SCRATCH_DIRECTORY: /work/jobs
    volumes:
      - worker-scratch:/work/jobs

  admin-web:
    build:
      context: ./frontend
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_BASE_URL: http://localhost:8080
        ADMIN_API_INTERNAL_URL: http://admin-api:8080
    depends_on:
      - admin-api
    ports:
      - "3001:3000"

  user-web:
    build:
      context: ./frontend
      dockerfile: apps/user-web/Dockerfile
      args:
        NEXT_PUBLIC_USER_API_BASE_URL: http://localhost:8088
    depends_on:
      - playback-lb
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  minio-data:
  redis-data:
  kafka-data:
  worker-scratch:
