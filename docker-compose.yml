name: ott_service

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ott_service
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -u\"$$MYSQL_USER\" -D ott_service -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mysql-init:
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PWD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mysql --protocol=TCP -hmysql -u"$$MYSQL_USER" -D ott_service -e 'SELECT 1';

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
        mc mb --ignore-existing local/ott-originals;
        mc mb --ignore-existing local/event-lake;

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${WATCH_EVENTS_PARTITIONS:-12}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/bitnami/kafka

  clickhouse:
    extends:
      file: ./backend/event-analytics/compose.yml
      service: clickhouse

  clickhouse-init:
    extends:
      file: ./backend/event-analytics/compose.yml
      service: clickhouse-init
    volumes:
      - ./backend/event-analytics/clickhouse:/schema:ro

  analytics-jobmanager:
    extends:
      file: ./backend/event-analytics/compose.yml
      service: analytics-jobmanager
    build:
      context: ./backend
      dockerfile: event-analytics/Dockerfile

  analytics-taskmanager:
    extends:
      file: ./backend/event-analytics/compose.yml
      service: analytics-taskmanager

  archive-kafka-init:
    extends:
      file: ./backend/event-archive/compose.yml
      service: archive-kafka-init

  archive-jobmanager:
    extends:
      file: ./backend/event-archive/compose.yml
      service: archive-jobmanager
    build:
      context: ./backend
      dockerfile: event-archive/Dockerfile

  archive-taskmanager:
    extends:
      file: ./backend/event-archive/compose.yml
      service: archive-taskmanager

  admin-api:
    build:
      context: ./backend
      dockerfile: admin-api/Dockerfile
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ott_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_WEB_ORIGIN: http://localhost:3001
      ANALYTICS_QUERY_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "8080:8080"

  user-api:
    build:
      context: ./backend
      dockerfile: user-api/Dockerfile
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ott_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      USER_WEB_ORIGIN: http://localhost:3000
      CATALOG_COUNTRY: ${CATALOG_COUNTRY:-KR}
      LOCAL_TEST_USER_ENABLED: ${LOCAL_TEST_USER_ENABLED:-false}
      LOCAL_TEST_USER_PASSWORD: ${LOCAL_TEST_USER_PASSWORD:-}
      USER_ACCESS_TOKEN_SECRET: ${USER_ACCESS_TOKEN_SECRET:?Set USER_ACCESS_TOKEN_SECRET in .env}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ANALYTICS_PLAYBACK_TOPIC: ${ANALYTICS_PLAYBACK_TOPIC:-playback-events}
      ANALYTICS_BEHAVIOR_TOPIC: ${ANALYTICS_BEHAVIOR_TOPIC:-behavior-events}
      ANALYTICS_SUBSCRIPTION_TOPIC: ${ANALYTICS_SUBSCRIPTION_TOPIC:-subscription-events}
      LOCAL_SUBSCRIPTION_ACTIVATION_ENABLED: ${LOCAL_SUBSCRIPTION_ACTIVATION_ENABLED:-false}
      SUBSCRIPTION_OUTBOX_ENABLED: ${SUBSCRIPTION_OUTBOX_ENABLED:-true}
      ANALYTICS_PARTITIONS: ${ANALYTICS_PARTITIONS:-12}
      WATCH_EVENTS_TOPIC: ${WATCH_EVENTS_TOPIC:-watch-events}
      WATCH_EVENTS_DLQ_TOPIC: ${WATCH_EVENTS_DLQ_TOPIC:-watch-events.dlq}
      WATCH_EVENTS_PARTITIONS: ${WATCH_EVENTS_PARTITIONS:-12}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

  playback-worker:
    build:
      context: ./backend
      dockerfile: playback-worker/Dockerfile
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ott_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WATCH_EVENTS_TOPIC: ${WATCH_EVENTS_TOPIC:-watch-events}
      WATCH_EVENTS_DLQ_TOPIC: ${WATCH_EVENTS_DLQ_TOPIC:-watch-events.dlq}
      PLAYBACK_CONSUMER_GROUP: ${PLAYBACK_CONSUMER_GROUP:-playback-progress-group}

  playback-lb:
    image: nginx:1.27-alpine
    depends_on:
      - user-api
    ports:
      - "8088:8088"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro

  media-worker:
    build:
      context: ./backend
      dockerfile: media-worker/Dockerfile
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ott_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      STORAGE_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MEDIA_WORKER_SCRATCH_DIRECTORY: /work/jobs
    volumes:
      - worker-scratch:/work/jobs

  admin-web:
    build:
      context: ./frontend
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_BASE_URL: http://localhost:8080
        ADMIN_API_INTERNAL_URL: http://admin-api:8080
    environment:
      ADMIN_API_INTERNAL_URL: http://admin-api:8080
    depends_on:
      - admin-api
    ports:
      - "3001:3000"

  user-web:
    build:
      context: ./frontend
      dockerfile: apps/user-web/Dockerfile
      args:
        NEXT_PUBLIC_USER_API_BASE_URL: http://localhost:8088
    depends_on:
      - playback-lb
    ports:
      - "3000:3000"

volumes:
  clickhouse-data:
  mysql-data:
  minio-data:
  redis-data:
  kafka-data:
  worker-scratch:
